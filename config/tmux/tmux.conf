set-option -g default-shell $HOME/.nix-profile/bin/zsh
unbind C-b
set-option -g prefix C-space
bind-key C-space send-prefix
set-option default-terminal "tmux-256color"
set-option -sa terminal-overrides ",xterm*:Tc"
set -g escape-time 10
set -g mouse on

# --- Basic ergonomics ---
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Intuitive pane splitting in current path
bind-key "|" split-window -h -c "#{pane_current_path}"
bind-key "-" split-window -v -c "#{pane_current_path}"
bind-key "c" new-window -c "#{pane_current_path}"

# Vi-style pane navigation
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# Quick configuration reload
bind-key r source-file ~/.config/tmux/tmux.conf \; display-message "Configuration reloaded!"

# --- Copy mode and FZF ---
set-window-option -g mode-keys vi
set -s set-clipboard on
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Session switcher using FZF
bind-key f display-popup -E -w 80% -h 80% \
    "tmux list-sessions -F '#{session_name}' | grep -v \"^$(tmux display-message -p '#S')\$\" | fzf --reverse | xargs tmux switch-client -t"

# Tmux control panel and worktree
bind-key w display-popup -E -w 98% -h 98% -d "#{pane_current_path}" "tmux-control-panel"

# --- Appearance (matched to Monokai Pro) ---
set -g status-style "bg=default,fg=white"
set -g status-left "#[fg=cyan,bold]#S "
set -g status-right "#[fg=white,bg=black] %H:%M #[default]"
set -g window-status-current-format "#[fg=black,bg=cyan,bold] #I:#W #[default]"
set -g window-status-format "#[fg=brightblack] #I:#W #[default]"

# Popup and menu styling
set -g popup-style "bg=default"
set -g popup-border-style "bg=default,fg=cyan"
set -g popup-border-lines rounded
set -g menu-style "bg=default,fg=white"
set -g menu-selected-style "bg=cyan,fg=black,bold"
set -g menu-border-style "bg=default,fg=cyan"
set -g menu-border-lines rounded

# --- Quick actions menu ---
bind-key space display-menu -T "#[fg=cyan,bold] Quick Actions " -x C -y C \
    "Helix (Root)"           h "display-popup -E -w 98% -h 98% -d \"#{pane_current_path}\" 'hx .'" \
    "Helix (Git Status)"     s "display-popup -E -w 98% -h 98% -d \"#{pane_current_path}\" '$HOME/.config/tmux/hx-git.sh'" \
    "Git Diff"               d "display-popup -E -w 98% -h 98% -d \"#{pane_current_path}\" 'git diff --color=always | less -R'" \
    "LazyGit"                g "display-popup -E -w 98% -h 98% -d \"#{pane_current_path}\" 'lazygit'" \
    "Shell"                  z "display-popup -E -w 98% -h 98% -d \"#{pane_current_path}\" 'zsh'" \
    "" \
    "Close other panes"      x "kill-pane -a" \
    "New session"            n "new-session" \
    "Reload config"          r "source-file ~/.config/tmux/tmux.conf"
